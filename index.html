  <script>
    (function () {
      try {
        var saved = localStorage.getItem("german_theme_v1");

        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
